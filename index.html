<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ================= META ================= -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="format-detection" content="telephone=no" />
  <title>Jack Macias | Mechanical Engineer</title>

  <!-- ================= PERFORMANCE ================= -->
  <!-- Preconnect fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Preload hero image (largest LCP element) -->
  <link rel="preload" as="image" href="assets/HomeBackground.jpg" fetchpriority="high" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet" />

  <!-- ================= STYLES ================= -->
  <style>
    /* ================= CSS VARIABLES ================= */
    :root {
      --maxw: 1200px;
      --gap: clamp(24px, 6vw, 64px);
      --c-gap: 24px;
      --navh: 64px; /* updated by JS */
      --accent: #000;
    }

    /* ================= RESET ================= */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: auto; scroll-padding-top: calc(var(--navh) + 8px); }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #222;
      background: #fff;
    }

    /* ================= NAVBAR ================= */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.35rem 2rem;
      background: #000;
      color: #fff;
    }
    .navbar .logo { font-weight: 800; font-size: 1.25rem; }
    .navbar ul { list-style: none; display: flex; gap: 1.25rem; margin: 0; padding: 0; }
    .navbar a {
      color: #fff;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      padding-bottom: 2px;
    }
    .navbar a:hover { border-color: #fff; }

    /* ================= SECTIONS ================= */
    .section { padding: 60px clamp(16px, 5vw, 48px); }
    .container { max-width: var(--maxw); margin: 0 auto; }
    .section-title {
      text-align: center;
      font-size: 2.25rem;
      font-weight: 800;
      margin: 0 0 1rem;
    }
    .section-underline {
      width: 80px;
      height: 6px;
      background: #000;
      border-radius: 4px;
      margin: 0.5rem auto 2rem;
    }

    /* ================= HERO (STEVENS STYLE) ================= */
    #home { padding: 0; min-height: calc(100vh - var(--navh)); }
    .stevens-wrap {
      display: grid;
      grid-template-columns: 75% 25%;
      min-height: calc(100vh - var(--navh));
      width: 100vw;
    }
    .stevens-left {
      position: relative;
      overflow: hidden;
    }
    .stevens-left::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url('assets/HomeBackground.jpg') center / cover no-repeat;
      filter: grayscale(100%) contrast(1.1) brightness(0.85);
      transform: scale(1.02);
    }
    .stevens-left::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.28);
    }
    .stevens-title-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 140px;
      color: #fff;
    }
    .stevens-name {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(2.8rem, 7.5vw, 6.2rem);
      font-weight: 800;
      margin: 0 0 0.35rem;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }
    .stevens-sub {
      font-size: clamp(2rem, 4.4vw, 2.7rem);
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    .stevens-right {
      background: #2f3336;
      display: grid;
      place-items: center;
      padding: clamp(24px, 6vw, 56px);
    }
    .stevens-pic {
      width: 300px;
      aspect-ratio: 1;
      border-radius: 50%;
      object-fit: cover;
    }

    /* ================= PROJECTS ================= */
    .project-row {
      display: grid;
      grid-template-columns: minmax(320px, 0.95fr) minmax(420px, 1.05fr);
      gap: var(--gap);
      max-width: var(--maxw);
      margin: 0 auto 4rem;
      overflow: hidden;
    }

    /* Carousel */
    .carousel { position: relative; overflow: hidden; }
    .carousel-viewport { overflow: hidden; }
    .carousel-track {
      display: flex;
      align-items: center;
      transition: transform 0.45s ease-in-out;
      will-change: transform;
    }
    .c-img {
      flex: 0 0 auto;
      max-height: clamp(180px, 26vh, 300px);
      max-width: min(420px, 38vw);
      margin: 0 calc(var(--c-gap)/2);
      object-fit: contain;
      opacity: 0.35;
      transform: scale(0.92);
      transition: transform 0.35s, opacity 0.35s;
    }
    .c-img.center { opacity: 1; transform: scale(1.06); }
    .c-img.adj { opacity: 0.65; transform: scale(1); }

    .c-controls {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 0.75rem;
    }
    .c-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: #000;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .c-btn:disabled { opacity: 0.4; cursor: default; }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 960px) {
      .stevens-wrap { grid-template-columns: 1fr; }
      .stevens-title-wrap { padding-left: 2rem; }
      .project-row { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <!-- ================= NAV ================= -->
  <nav class="navbar" id="navbar">
    <div class="logo">Jack Macias</div>
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- ================= HERO ================= -->
  <section id="home">
    <div class="stevens-wrap">
      <div class="stevens-left">
        <div class="stevens-title-wrap">
          <h1 class="stevens-name">Jack Macias</h1>
          <div class="stevens-sub">Mechanical Engineer</div>
        </div>
      </div>
      <div class="stevens-right">
        <img src="assets/IMG_1174.jpg" alt="Jack Macias" class="stevens-pic" loading="eager" />
      </div>
    </div>
  </section>

  <!-- ================= PROJECTS ================= -->
  <section id="projects" class="section">
    <div class="container">
      <h2 class="section-title">Projects</h2>
      <div class="section-underline"></div>

      <!-- Example project carousel structure retained -->
      <!-- Repeat per project -->
    </div>
  </section>

  <!-- ================= SCRIPTS ================= -->
  <script defer>
    /* ===== NAV HEIGHT ===== */
    const nav = document.getElementById('navbar');
    document.documentElement.style.setProperty('--navh', `${nav.offsetHeight}px`);

    /* ===== CAROUSEL (NON-LOOPING) ===== */
    document.querySelectorAll('.carousel').forEach(carousel => {
      const track = carousel.querySelector('.carousel-track');
      const images = [...carousel.querySelectorAll('.c-img')];
      const prevBtn = carousel.querySelector('.c-prev');
      const nextBtn = carousel.querySelector('.c-next');

      let index = 0;

      function update() {
        const imgWidth = images[0].offsetWidth + parseFloat(getComputedStyle(images[0]).marginRight) * 2;
        track.style.transform = `translateX(${-index * imgWidth}px)`;

        images.forEach((img, i) => {
          img.classList.toggle('center', i === index);
          img.classList.toggle('adj', Math.abs(i - index) === 1);
        });

        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === images.length - 1;
      }

      prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); update(); });
      nextBtn.addEventListener('click', () => { index = Math.min(images.length - 1, index + 1); update(); });

      window.addEventListener('resize', update);
      update();
    });
  </script>
</body>
</html>
