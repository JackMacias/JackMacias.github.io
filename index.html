
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:black; overflow:hidden; font-family:Helvetica, Arial, sans-serif; }

.hero { position:relative; width:100vw; height:100vh; background:black; }

.hero-background {
  position:absolute;
  inset:0;
  background-position:center;
  background-size:100vw 100vh;
  background-repeat:no-repeat;
  z-index:1;
}

.blinds {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  z-index:2;
}

.blind {
  flex:1;
  background-position:center;
  background-size:100vw 100vh;
  background-repeat:no-repeat;
  clip-path: inset(100% 0 0 0);
  transition: clip-path 0.8s ease;
}

.hero-text {
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:4rem;
  z-index:3;
  opacity:0;
  transform:translateY(40px);
  animation:textIn 1.5s ease forwards;
}

@keyframes textIn {
  to { opacity:1; transform:translateY(0); }
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-background" id="bg"></div>

  <div class="blinds" id="blinds">
    <div class="blind"></div>
    <div class="blind"></div>
    <div class="blind"></div>
    <div class="blind"></div>
  </div>

  <div class="hero-text">Welcome</div>
</div>

<script>
const bg1 = "BascomHill.png";
const bg2 = "Background2.png";

const bgLayer = document.getElementById("bg");
const blinds = document.querySelectorAll(".blind");

function setBlindsImage(src) {
  blinds.forEach(b => b.style.backgroundImage = `url(${src})`);
}

function revealBlinds() {
  blinds.forEach((b, i) => {
    setTimeout(() => {
      b.style.clipPath = "inset(0 0 0 0)";
    }, i * 200);
  });
}

function coverBlinds() {
  blinds.forEach((b, i) => {
    setTimeout(() => {
      b.style.clipPath = "inset(100% 0 0 0)";
    }, i * 200);
  });
}

let current = 0;

function cycle() {
  const nextImage = current === 0 ? bg1 : bg2;

  setBlindsImage(nextImage);
  revealBlinds();

  setTimeout(() => {
    bgLayer.style.backgroundImage = `url(${nextImage})`;
  }, 1000);

  setTimeout(() => {
    coverBlinds();
    current = current === 0 ? 1 : 0;
  }, 3000);
}

setTimeout(() => {
  cycle();
  setInterval(cycle, 5000);
}, 1800);
</script>

</body>
</html>
