<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jack Macias | Mechanical Engineer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --maxw: 1200px;
      --gap: clamp(24px, 6vw, 64px);
      --accent: #000;
      --c-gap: 24px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0; color: #222; background: #fff;
    }

    /* NAV */
    .navbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem; background: #000; color: #fff;
    }
    .navbar .logo { font-weight: 700; font-size: 1.25rem; }
    .navbar ul { display: flex; gap: 1.25rem; margin: 0; padding: 0; list-style: none; }
    .navbar a { color: #fff; text-decoration: none; border-bottom: 2px solid transparent; padding-bottom: 2px; }
    .navbar a:hover { border-color: #fff; }

    /* LAYOUT */
    .section { padding: 60px clamp(16px, 5vw, 48px); }
    .container { max-width: var(--maxw); margin: 0 auto; }
    .section-title { text-align: center; font-size: 2.25rem; margin: 0 0 1rem; font-weight: 800; }
    .section-underline { width: 80px; height: 6px; background: #000; border-radius: 4px; margin: 0.5rem auto 2rem; }

    /* HERO */
    .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: var(--gap); align-items: center; }
    .hero h1 { font-size: clamp(2.25rem, 4vw, 3.5rem); margin: 0 0 0.5rem; }
    .cta-button { display: inline-block; margin-top: 1rem; padding: 0.6rem 1.1rem; background: #000; color:#fff; text-decoration:none; border-radius: 6px; font-weight: 700; }
    .hero-img { width: 340px; max-width: 100%; height: 340px; object-fit: cover; border-radius: 50%; box-shadow: 0 0 48px 16px rgba(0,0,0,.35); justify-self: center; }

    /* EXPERIENCE */
    .timeline { position: relative; display: grid; gap: 2rem; max-width: 900px; margin: 0 auto; }
    .t-box { border: 1px solid #000; border-radius: 8px; padding: 1rem 1.25rem; box-shadow: 0 2px 6px rgba(0,0,0,.05); }
    .t-box h3 { margin: 0 0 .25rem; }
    .t-box h4 { margin: 0 0 .5rem; color: #555; font-weight: 500; }
    .t-box ul { margin: 0; padding-left: 1rem; }

    /* PROJECTS */
    .project-row {
      display: grid;
      grid-template-columns: minmax(320px, 0.95fr) minmax(420px, 1.05fr);
      gap: var(--gap);
      align-items: start;
      margin: 0 auto 4rem;
      max-width: var(--maxw);
      overflow: hidden;
    }
    .project-text h3 { margin: 0 0 .5rem; font-size: 1.35rem; }
    .project-text p { margin: 0; line-height: 1.6; max-width: 38ch; }

    /* Carousel */
    .carousel { position: relative; width: 100%; max-width: 100%; overflow: hidden; }
    .carousel-viewport { overflow: hidden; width: 100%; }
    .carousel-track { display: flex; align-items: center; transition: transform .5s ease-in-out; }
    .c-img { flex: 0 0 auto; max-height: clamp(180px, 26vh, 300px); max-width: min(420px, 38vw); margin: 0 calc(var(--c-gap)/2); object-fit: contain; opacity: .35; transform: scale(.92); transition: transform .4s, opacity .4s; }
    .c-img.center { opacity: 1; transform: scale(1.06); }
    .c-img.adj { opacity: .65; transform: scale(1); }

    .c-controls { display: flex; gap: 2.5rem; justify-content: center; margin-top: .75rem; }
    .c-btn { width: 52px; height: 52px; border-radius: 50%; border: none; background: #000; color: #fff; font-size: 1.5rem; cursor: pointer; }
    .c-btn:hover { background: #333; }

    /* FOOTER */
    footer { background: #000; color: #fff; }
    .footer-inner { display: grid; grid-template-columns: 2fr 1fr; gap: var(--gap); max-width: var(--maxw); margin: 0 auto; padding: 2rem 5vw; }
    footer a { color: #fff; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* RESPONSIVE */
    @media (max-width: 960px) {
      .hero { grid-template-columns: 1fr; }
      .project-row { grid-template-columns: 1fr; }
      .project-text { order: 1; }
      .carousel { order: 2; }
      .c-controls { gap: 1.5rem; }
    }
  </style>
</head>
<body>
  <!-- NAV -->
  <nav class="navbar">
    <div class="logo">Jack Macias</div>
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="section hero-section" id="home">
    <div class="container hero">
      <div>
        <h1>Hello, I'm<br><span class="hero-name">Jack Macias</span></h1>
        <p class="typed-text">Mechanical Engineering @ UW–Madison</p>
        <a class="cta-button" href="#contact">Contact Me</a>
      </div>
      <img class="hero-img" src="assets/IMG_1174.jpg" alt="Jack Macias portrait" />
    </div>
  </section>

  <!-- (rest of the HTML unchanged, as above) -->

</body>
</html>
